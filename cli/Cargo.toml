# SPDX-License-Identifier: Apache-2.0

[package]
name = "code2graph-cli"
version.workspace = true
edition.workspace = true
# `zerompk` (cache codec) uses `core::hint::cold_path`, stable since 1.95, so the
# CLI floor sits above the workspace library MSRV.
rust-version = "1.95"
license.workspace = true
description = "Standalone project query and indexing consumer for code2graph."
repository = "https://github.com/nodedb-lab/code2graph"
keywords = ["code-graph", "static-analysis", "cli", "symbols"]
categories = ["command-line-utilities", "development-tools"]
readme.workspace = true

[[bin]]
name = "code2graph"
path = "src/main.rs"

[dependencies]
code2graph = { workspace = true, features = ["serde", "manifest"] }
code2graph-query.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ignore = "0.4"
blake3 = "1"
toml = "1"
directories.workspace = true
zerompk = { version = "=0.6.1", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.13"
rustc-hash.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
